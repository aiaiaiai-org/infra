apiVersion: infra.nilx.one/v1
kind: ServerContract
metadata:
  name: edge-prod-2
  owner: aiaiaiai-org/infra
spec:
  role: public-edge
  edgeNetwork: aiaiaiai-edge
  publicPorts:
    - 80/tcp
    - 443/tcp
    - 443/udp
  runtimeRoot: /opt/infra/targets/edge-prod-2
  # Public half of this Environment's SSH_PRIVATE_KEY, printed by Issue workload encryption
  # recipient. Producers encrypt their secret envelopes to it (docs/automatic-delivery.md).
  encryptionRecipient: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHLqRGs3btQfLFONwvvHVwZhn3VnGDaIioF0elfZbU6d
  workloads:
    - aiaiaiai-site
    - prism-postgres
    - prism-hub
    - prism-hubot
    - h-ua-bot
