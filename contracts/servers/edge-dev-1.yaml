apiVersion: infra.nilx.one/v1
kind: ServerContract
metadata:
  name: edge-dev-1
  owner: aiaiaiai-org/infra
spec:
  provider: contabo
  role: public-edge
  publicAddress: 158.220.74.54
  # The one public Caddy of this VPS (`nilx-public-edge-managed`, owner of 80 and 443 here) and its network.
  # Contracts describe it; no workflow ever starts a second public ingress on this host.
  edgeNetwork: nilx-candidate
  publicPorts:
    - 80/tcp
    - 443/tcp
  runtimeRoot: /opt/infra/targets/edge-dev-1
  # Public half of this Environment's SSH_PRIVATE_KEY (the key of "Issue workload encryption recipient").
  # Producers encrypt their secret envelopes to it (docs/automatic-delivery.md).
  encryptionRecipient: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDfJeAVyF49oZY1XReEaT/LHF5pZgpV2iNewJTwh2UbL
  # The Prism chain and its Telegram bot (docs/aiaiaiai-edge-migration.md), and the 0x1 product
  # (nilx-one/*: web clients, Telegram, Discord, identity), which already runs here behind the
  # managed ingress. Its contracts describe that placement; delivery stays manual.
  workloads:
    - prism-postgres
    - prism-hub
    - prism-hubot
    - prism-ai-tts
    - h-ua-bot
    - 4x-errors
    - nilxone-web
    - nilxone-telegram
    - nilxone-discord
    - nilxone-identity
    - market-postgres-production
    - market-api-production
    - market-bot-production
    - market-trading-lab
    - market-trading-lab-okx-collector
