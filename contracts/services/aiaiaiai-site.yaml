apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: aiaiaiai-site
  owner: aiaiaiai-org/aiaiaiai.org
spec:
  deployment: production
  network: aiaiaiai-edge
  aliases:
    - aiaiaiai-site
  protocol: http
  port: 1927
  health: /healthz
  runtime:
    kind: container
  public:
    host: aiaiaiai.org
    pathPrefix: /
  # Legacy edge-prod-2 delivery is intentionally manual during the VPS
  # snapshot migration; this is the rollback workload, not the new archive.
  # The product holds no credential for infra.
  delivery:
    # Freeze legacy edge-prod-2 auto-delivery during path-scoped VPS migration.
    # Snapshot activation on edge-dev-1 is explicit and separate.
    mode: manual
    image: ghcr.io/aiaiaiai-org/aiaiaiai.org
    branch: master
    signerWorkflow: .github/workflows/publish.yml
