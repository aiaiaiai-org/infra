apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: aiaiaiai-site
  owner: aiaiaiai-org/aiaiaiai.org
spec:
  deployment: production
  network: aiaiaiai-edge
  aliases:
    - aiaiaiai-site
  protocol: http
  port: 1927
  health: /healthz
  runtime:
    kind: container
  public:
    host: aiaiaiai.org
    pathPrefix: /
  # Infra delivers each verified master build on its own (docs/automatic-delivery.md).
  # The product holds no credential for infra.
  delivery:
    image: ghcr.io/aiaiaiai-org/aiaiaiai.org
    branch: master
    signerWorkflow: .github/workflows/publish-development.yml
