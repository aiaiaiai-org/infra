apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: market-api-development
  owner: 0xda-market/core
spec:
  deployment: test
  network: nilx-edge
  aliases:
    - market-api-development
  protocol: http
  port: 10000
  health: /health
  # Infra delivers each verified master build on its own (docs/automatic-delivery.md).
  # Core publishes development under its own package: production's ghcr.io/0xda-market/core
  # already carries that commit's one <sha>.secrets envelope.
  delivery:
    image: ghcr.io/0xda-market/core-development
    branch: master
    signerWorkflow: .github/workflows/ci.yml
  runtime:
    kind: container
    environment:
      - DEPLOY_ENV=development
      - PORT=10000
      - ENABLE_MOCK_PAYMENT_PROVIDER=0
      - MARKETPLACE_MIN_MARGIN_BPS=100
      - MARKETPLACE_SUPPLY_BUFFER_BPS=100
      - MARKETPLACE_VARIABLE_FEE_BPS=0
      - MARKETPLACE_FIXED_COST_USDT=0
      - FX_RATE_MAX_AGE_SECONDS=3600
      - CHANNEL_ASSERTION_PROVIDERS=telegram
      - ISSUER_DIRECTORY_PROVIDERS=telegram
    secrets:
      - DATABASE_URL=DATABASE_URL
      - PUBLIC_API_TOKEN=PUBLIC_API_TOKEN
      - MANUAL_PROVIDER_TOKEN=MANUAL_PROVIDER_TOKEN
      - NILX_BROWSER_HANDOFF_TOKEN=NILX_BROWSER_HANDOFF_TOKEN
      - ISSUER_DIRECTORY_TOKEN=PARTNER_LOOKUP_TOKEN
      - CHANNEL_ASSERTION_SECRET=CHANNEL_ASSERTION_SECRET
    producerEnvironment:
      - ISSUER_DIRECTORY_URL
