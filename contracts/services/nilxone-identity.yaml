apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: nilxone-identity
  owner: nilx-one/web
spec:
  deployment: production
  network: nilx-edge
  aliases:
    - nilxone-identity
  protocol: http
  port: 1927
  health: /health
  # Infra deploys the producer's verified master head on its own (docs/automatic-delivery.md).
  # The envelope carries the provider credentials only. NATIVE_AUTH_SECRET, PASSWORD_PEPPER and
  # GITHUB_EVIDENCE_ENCRYPTION_KEY stay on the host: prepare-runtime-env.sh keeps the existing
  # values and refuses an override, and validate-contracts.rb refuses them here.
  delivery:
    image: ghcr.io/nilx-one/0x1-identity
    branch: master
    signerWorkflow: .github/workflows/package-identity-service.yml
    envelope:
      - TELOXIDE_TOKEN
      - TELEGRAM_OIDC_CLIENT_ID
      - TELEGRAM_OIDC_CLIENT_SECRET
      - DISCORD_CLIENT_ID
      - DISCORD_CLIENT_SECRET
      - NILX_BROWSER_HANDOFF_TOKEN
  runtime:
    kind: container
    environment:
      - HTTP_BIND=0.0.0.0:1927
      - DATABASE_URL=sqlite:///data/identity.db
      - TELEGRAM_INIT_DATA_MAX_AGE_SECONDS=300
    prepareEnv: services/identity/deploy/prepare-runtime-env.sh
    labels:
      - one.nilx.product=0x1
      - one.nilx.service=identity
      - one.nilx.identity.contract=19
    volumes:
      - nilxone-identity-data:/data
  public:
    host: nilx.one
    pathPrefix: /api/v1/
