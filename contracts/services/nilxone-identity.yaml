apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: nilxone-identity
  owner: nilx-one/web
spec:
  deployment: production
  network: nilx-edge
  aliases:
    - nilxone-identity
  protocol: http
  port: 1927
  health: /health
  # Publishing a verified image from Web master is not authorization for a
  # production Identity Service deploy. Scheduled and unfiltered Reconcile
  # deliveries skip this workload; release it only through a named, manually
  # authorized dispatch (Reconcile deliveries with this workload, or Deploy
  # workload with an explicit image).
  # The envelope carries provider credentials only; server-owned secrets
  # stay on the host and are never overridden.
  delivery:
    mode: manual
    image: ghcr.io/nilx-one/0x1-identity
    branch: master
    signerWorkflow: .github/workflows/package-identity-service.yml
    envelope:
      - TELOXIDE_TOKEN
      - TELEGRAM_OIDC_CLIENT_ID
      - TELEGRAM_OIDC_CLIENT_SECRET
      - DISCORD_CLIENT_ID
      - DISCORD_CLIENT_SECRET
      - NILX_BROWSER_HANDOFF_TOKEN
  runtime:
    kind: container
    environment:
      - HTTP_BIND=0.0.0.0:1927
      - DATABASE_URL=sqlite:///data/identity.db
      - TELEGRAM_INIT_DATA_MAX_AGE_SECONDS=300
      # Sign-in through AIS (auth.aiaiaiai.org). 0x1 is a public client: no secret, only this
      # public address, and it is the one switch that turns the routes on. Without it the
      # /api/v1/auth/aiaiaiai/* routes answer "not configured".
      - AIAIAIAI_SIGN_IN_ISSUER=https://auth.aiaiaiai.org
    prepareEnv: services/identity/deploy/prepare-runtime-env.sh
    labels:
      - one.nilx.product=0x1
      - one.nilx.service=identity
      - one.nilx.identity.contract=19
    volumes:
      - nilxone-identity-data:/data
  public:
    host: nilx.one
    pathPrefix: /api/v1/
