apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: 4x-ais
  owner: aiaiaiai-org/4x-ais
spec:
  deployment: production
  network: aiaiaiai-edge
  aliases:
    - 4x-ais
  protocol: http
  port: 1927
  health: /healthz
  runtime:
    kind: container
    labels:
      - org.aiaiaiai.product=ais
      - org.aiaiaiai.service=4x-ais
    # AIS makes its own secrets on the host: the signing key, AIS_SECRET and the password pepper
    # are generated once by the producer's script and kept there. No GitHub Environment holds
    # them and no envelope carries them. The script also writes the issuer and the registered
    # clients (docs/runtime.md in aiaiaiai-org/4x-ais).
    prepareEnv: deploy/prepare-runtime-env.sh
    prepareEnvSecrets: true
    volumes:
      - 4x-ais-data:/data
  # The aiaiaiai auth identity service: the one sign-in origin for every product
  # (docs/service-design.md in aiaiaiai-org/4x-ais). Its OIDC paths are not under
  # a prefix, so the whole host is routed to it.
  public:
    host: auth.aiaiaiai.org
    pathPrefix: /
  # Automatic delivery of the verified master head (docs/automatic-delivery.md). 4x-ais is
  # public, publishes an attested image, and grants this repository Read on the package: the
  # planner aborts every delivery on a registry error other than a missing tag, so this block
  # must never be merged before that Read access is in place. No envelope: AIS makes its own
  # secrets on the host (runtime.prepareEnvSecrets).
  delivery:
    image: ghcr.io/aiaiaiai-org/4x-ais
    branch: master
    signerWorkflow: .github/workflows/publish.yml
