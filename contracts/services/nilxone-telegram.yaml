apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: nilxone-telegram
  owner: nilx-one/web
spec:
  deployment: production
  network: nilx-edge
  aliases:
    - nilxone-telegram
  protocol: http
  port: 1927
  health: /health
  runtime:
    kind: container
    environment:
      - CLIENT_ROOT=/srv/telegram-mini-app
  public:
    host: nilx.one
    pathPrefix: /telegram/
  # Infra delivers each verified master build on its own (docs/automatic-delivery.md).
  # The product holds no credential for infra.
  delivery:
    image: ghcr.io/nilx-one/web
    branch: master
    signerWorkflow: .github/workflows/package-web.yml
