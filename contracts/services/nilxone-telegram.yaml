apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: nilxone-telegram
  owner: nilx-one/web
spec:
  deployment: production
  network: nilx-edge
  aliases:
    - nilxone-telegram
  protocol: http
  port: 1927
  health: /health
  public:
    host: nilx.one
    pathPrefix: /telegram/
