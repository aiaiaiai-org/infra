apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: nilxone-telegram
  owner: nilx-one/web
spec:
  deployment: production
  network: nilx-candidate
  aliases:
    - nilxone-telegram
  protocol: http
  port: 1927
  health: /health
  runtime:
    kind: container
    environment:
      - CLIENT_ROOT=/srv/telegram-mini-app
  public:
    host: nilx.one
    pathPrefix: /telegram/
  # The 0x1 product already runs on edge-dev-1 behind the managed ingress, staged by hand. This
  # contract describes it; Reconcile must not start a second copy beside it.
  delivery:
    mode: manual
    image: ghcr.io/nilx-one/web
    branch: master
    signerWorkflow: .github/workflows/package-web.yml
