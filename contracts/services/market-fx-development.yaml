apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: market-fx-development
  owner: 0xda-market/core
spec:
  deployment: test
  network: nilx-edge
  aliases:
    - market-fx-development
  protocol: tcp
  port: 1703
  healthKind: process
  runtime:
    kind: container
    command:
      - bundle
      - exec
      - ruby
      - bin/refresh_fx_rates_loop
    environment:
      - DEPLOY_ENV=development
      - FX_RATE_PROVIDER=coinbase
      - FX_RATE_REFRESH_INTERVAL_SECONDS=300
      - FX_RATE_RETRY_INTERVAL_SECONDS=60
      - FX_RATE_REQUEST_TIMEOUT_SECONDS=10
    secrets:
      - DATABASE_URL=DATABASE_URL
