apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: nilxone-discord
  owner: nilx-one/web
spec:
  deployment: production
  network: nilx-edge
  aliases:
    - nilxone-discord
  protocol: http
  port: 1927
  health: /health
  runtime:
    kind: container
    environment:
      - CLIENT_ROOT=/srv/discord-activity
  public:
    host: nilx.one
    pathPrefix: /discord/
