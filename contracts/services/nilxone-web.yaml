apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: nilxone-web
  owner: nilx-one/web
spec:
  deployment: production
  network: nilx-edge
  aliases:
    - nilxone-web
  protocol: http
  port: 1927
  health: /health
  runtime:
    kind: container
    environment:
      - CLIENT_ROOT=/srv/site
    volumes:
      - nilxone-web-map-data:/srv/map-data:ro
  public:
    host: nilx.one
    pathPrefix: /
