apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: nilxone-web
  owner: nilx-one/web
spec:
  deployment: production
  network: nilx-edge
  aliases:
    - nilxone-web
  protocol: http
  port: 1927
  health: /health
  runtime:
    kind: container
    environment:
      - CLIENT_ROOT=/srv/site
    prepareEnv: deploy/web/prepare-map-runtime.sh
    volumes:
      - nilxone-web-map-data:/srv/map-data:ro
  public:
    host: nilx.one
    pathPrefix: /
  # Infra delivers each verified master build on its own (docs/automatic-delivery.md).
  # The product holds no credential for infra.
  delivery:
    image: ghcr.io/nilx-one/web
    branch: master
    signerWorkflow: .github/workflows/package-web.yml
