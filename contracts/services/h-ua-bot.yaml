apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: h-ua-bot
  owner: 0x0sky/h-ua-bot
spec:
  deployment: production
  network: nilx-candidate
  aliases:
    - h-ua-bot
  protocol: http
  port: 1927
  health: /health
  runtime:
    kind: container
    # Values belong to the producing repository; infra defines only the allowlist.
    producerEnvironment:
      - HUA_HUB_ORIGIN
      - HUA_HUB_PROVIDER_SCOPE
      - HUA_ALERT_CHANNEL
      - HUA_SOURCES
    secrets:
      - HUA_TELEGRAM_TOKEN=HUA_TELEGRAM_TOKEN
      - HUA_HUB_TOKEN=HUA_HUB_TOKEN
      - HUA_DELIVERY_SECRET=HUA_DELIVERY_SECRET
    labels:
      - org.aiaiaiai.product=h-ua-bot
      - org.aiaiaiai.service=h-ua-bot
  public:
    host: api.aiaiaiai.org
    pathPrefix: /hua-bot/
  # Infra pulls the producer's verified master build; the producer holds no credential for infra. Its secrets
  # and the producer variables above arrive only in its attested envelope (docs/automatic-delivery.md),
  # sealed to this server's recipient. Released on purpose, with an explicit dispatch of Reconcile deliveries.
  delivery:
    mode: manual
    image: ghcr.io/0x0sky/h-ua-bot
    branch: master
    signerWorkflow: .github/workflows/publish.yml
