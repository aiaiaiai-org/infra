apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: h-ua-bot
  owner: 0x0sky/h-ua-bot
spec:
  deployment: production
  network: aiaiaiai-edge
  aliases:
    - h-ua-bot
  protocol: http
  port: 1927
  health: /health
  runtime:
    kind: container
    # Values belong to the producing repository; infra defines only the allowlist.
    producerEnvironment:
      - HUA_HUB_ORIGIN
      - HUA_HUB_PROVIDER_SCOPE
      - HUA_ALERT_CHANNEL
      - HUA_SOURCES
    secrets:
      - HUA_TELEGRAM_TOKEN=HUA_TELEGRAM_TOKEN
      - HUA_HUB_TOKEN=HUA_HUB_TOKEN
      - HUA_DELIVERY_SECRET=HUA_DELIVERY_SECRET
    labels:
      - org.aiaiaiai.product=h-ua-bot
      - org.aiaiaiai.service=h-ua-bot
  public:
    host: api.aiaiaiai.org
    pathPrefix: /hua-bot/
