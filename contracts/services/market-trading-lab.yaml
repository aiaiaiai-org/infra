apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: market-trading-lab
  owner: 0xda-market/trading-lab
spec:
  deployment: production
  network: nilx-edge
  aliases:
    - market-trading-lab
  protocol: http
  port: 1927
  health: /health
  runtime:
    kind: container
    # No public route. Only workloads on nilx-edge can reach the private service.
    environment:
      - PORT=1927
    # Both arrive in trading-lab's production envelope. The research database is the
    # trading_lab database in market-postgres-production (docs/market-trading-lab.md).
    secrets:
      - TRADING_LAB_SERVICE_TOKEN=TRADING_LAB_SERVICE_TOKEN
      - TRADING_LAB_DATABASE_URL=TRADING_LAB_DATABASE_URL
    labels:
      - org.aiaiaiai.product=0xda-market
      - org.aiaiaiai.service=trading-lab
