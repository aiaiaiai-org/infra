apiVersion: infra.nilx.one/v1
kind: WorkloadContract
metadata:
  name: market-bot-test
  owner: 0xda-market/telegram-bot
spec:
  deployment: test
  network: nilx-edge
  aliases:
    - market-bot-development
  protocol: http
  port: 10000
  health: /health
  public:
    host: 0xda-market.nilx.one
    pathPrefix: /bot-test/
  # Infra delivers each verified master build on its own (docs/automatic-delivery.md). Its
  # credentials and producer variables arrive only in telegram-bot's attested envelope.
  delivery:
    image: ghcr.io/0xda-market/telegram-bot
    branch: master
    signerWorkflow: .github/workflows/ci.yml
  runtime:
    kind: container
    environment:
      - DEPLOY_ENV=development
      - MARKET_CORE_ENV=development
      - PORT=10000
      - REGISTER_TELEGRAM_WEBHOOK=0
      - REGISTER_TELEGRAM_WEBAPP=0
      - TRADING_LAB_ORIGIN=http://market-trading-lab-development:1703
    secrets:
      - TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN
      - TELEGRAM_WEBHOOK_SECRET=TELEGRAM_WEBHOOK_SECRET
      - MARKET_API_TOKEN=MARKET_API_TOKEN
      - TRADING_LAB_TOKEN=TRADING_LAB_TOKEN
    producerEnvironment:
      - TELEGRAM_BOT_USERNAME
      - MARKET_API_URL
      - PUBLIC_URL
