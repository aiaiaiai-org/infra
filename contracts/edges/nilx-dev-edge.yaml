apiVersion: infra.nilx.one/v1
kind: EdgeContract
metadata:
  name: nilx-dev-edge
  owner: aiaiaiai-org/infra
spec:
  placement:
    target: edge-dev-1
  network:
    name: nilx-dev-edge
    external: true
    driver: bridge
  entrypoint:
    service: caddy
    image: caddy:2-alpine
    ports:
      - 80/tcp
      - 443/tcp
      - 443/udp
    tls: automatic
  routes:
    - id: nilxone-web-development
      host: dev.nilx.one
      pathPrefix: /
      stripPrefix: false
      service: nilxone-web-development
      upstream: nilxone-web-development:1703
      health: /health
