apiVersion: infra.nilx.one/v1
kind: EdgeContract
metadata:
  name: aiaiaiai-edge
  owner: aiaiaiai-org/infra
spec:
  placement:
    target: edge-prod-2
  network:
    name: aiaiaiai-edge
    external: true
    driver: bridge
  entrypoint:
    service: caddy
    image: caddy:2-alpine
    ports:
      - 80/tcp
      - 443/tcp
      - 443/udp
    tls: automatic
  routes:
    - id: aiaiaiai-site
      host: ${AIAIAIAI_SITE_DOMAIN}
      pathPrefix: /
      service: aiaiaiai-site
      upstream: aiaiaiai-site:1927
      health: /healthz
    # Development hostname; reuses the existing site workload until
    # immutable snapshot routing is implemented separately.
    - id: aiaiaiai-site-beta
      host: ${AIAIAIAI_SITE_BETA_DOMAIN}
      pathPrefix: /
      service: aiaiaiai-site
      upstream: aiaiaiai-site:1927
      health: /healthz
    # The aiaiaiai auth identity service (aiaiaiai-org/4x-ais). The whole host,
    # because its OIDC paths (/authorize, /token, /.well-known/*) have no prefix.
    - id: 4x-ais
      host: ${AIAIAIAI_AUTH_DOMAIN}
      pathPrefix: /
      service: 4x-ais
      upstream: 4x-ais:1927
      health: /healthz
    # The error collector (aiaiaiai-org/4x-errors): the browser SDK's ingest endpoint for
    # every product. The whole host, because /v1/browser/events, /ready and /health have
    # no common prefix. Liveness here, readiness at deploy: a database blip must not make
    # the edge answer 503 for a collector that retries and queues on its own.
    - id: 4x-errors
      host: ${AIAIAIAI_ERRORS_DOMAIN}
      pathPrefix: /
      service: 4x-errors
      upstream: 4x-errors:1927
      health: /health
    - id: hua-bot
      host: ${PRISM_API_DOMAIN}
      pathPrefix: /hua-bot/
      stripPrefix: true
      service: h-ua-bot
      upstream: h-ua-bot:1927
      health: /health
