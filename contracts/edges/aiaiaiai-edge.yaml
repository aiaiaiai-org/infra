apiVersion: infra.nilx.one/v1
kind: EdgeContract
metadata:
  name: aiaiaiai-edge
  owner: aiaiaiai-org/infra
spec:
  placement:
    target: edge-prod-2
  network:
    name: aiaiaiai-edge
    external: true
    driver: bridge
  entrypoint:
    service: caddy
    image: caddy:2-alpine
    ports:
      - 80/tcp
      - 443/tcp
      - 443/udp
    tls: automatic
  routes:
    - id: aiaiaiai-site
      host: ${AIAIAIAI_SITE_DOMAIN}
      pathPrefix: /
      service: aiaiaiai-site
      upstream: aiaiaiai-site:1927
      health: /healthz
    # Development hostname; reuses the existing site workload until
    # immutable snapshot routing is implemented separately.
    - id: aiaiaiai-site-beta
      host: ${AIAIAIAI_SITE_BETA_DOMAIN}
      pathPrefix: /
      service: aiaiaiai-site
      upstream: aiaiaiai-site:1927
      health: /healthz
    # The aiaiaiai auth identity service (aiaiaiai-org/4x-ais). The whole host,
    # because its OIDC paths (/authorize, /token, /.well-known/*) have no prefix.
    - id: aiaiaiai-ais
      host: ${AIAIAIAI_AUTH_DOMAIN}
      pathPrefix: /
      service: aiaiaiai-ais
      upstream: aiaiaiai-ais:1927
      health: /health
    - id: prism-hub
      host: ${PRISM_API_DOMAIN}
      pathPrefix: /prism-hub/
      stripPrefix: true
      service: prism-hub
      upstream: prism-hub:1927
      health: /healthz
    - id: hua-bot
      host: ${PRISM_API_DOMAIN}
      pathPrefix: /hua-bot/
      stripPrefix: true
      service: h-ua-bot
      upstream: h-ua-bot:1927
      health: /health
    - id: prism-hubot
      host: ${PRISM_API_DOMAIN}
      pathPrefix: /prism-hubot/
      stripPrefix: true
      service: prism-hubot
      upstream: prism-hubot:1927
      health: /healthz
