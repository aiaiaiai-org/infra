apiVersion: infra.nilx.one/v1
kind: EdgeContract
metadata:
  name: aiaiaiai-dev-edge
  owner: aiaiaiai-org/infra
spec:
  placement:
    target: edge-dev-1
  # The network of edge-dev-1's existing public Caddy. The entrypoint below describes that ingress
  # (`nilx-public-edge-managed`); it is changed only by the reviewed route scripts
  # (deploy/aiaiaiai-edge-dev-1/route.sh), never started a second time.
  network:
    name: nilx-candidate
    external: true
    driver: bridge
  entrypoint:
    service: caddy
    image: caddy:2-alpine
    ports:
      - 80/tcp
      - 443/tcp
    tls: automatic
  routes:
    - id: prism-hub
      host: ${PRISM_API_DOMAIN}
      pathPrefix: /prism-hub/
      stripPrefix: true
      service: prism-hub
      upstream: prism-hub:1927
      health: /healthz
    - id: prism-hubot
      host: ${PRISM_API_DOMAIN}
      pathPrefix: /prism-hubot/
      stripPrefix: true
      service: prism-hubot
      upstream: prism-hubot:1927
      health: /healthz
    - id: hua-bot
      host: ${PRISM_API_DOMAIN}
      pathPrefix: /hua-bot/
      stripPrefix: true
      service: h-ua-bot
      upstream: h-ua-bot:1927
      health: /health
    - id: nilxone-identity
      host: ${NILX_WEB_DOMAIN}
      pathPrefix: /api/v1/
      stripPrefix: false
      service: nilxone-identity
      upstream: nilxone-identity:1927
      health: /health
    - id: nilxone-telegram
      host: ${NILX_WEB_DOMAIN}
      pathPrefix: /telegram/
      stripPrefix: true
      service: nilxone-telegram
      upstream: nilxone-telegram:1927
      health: /health
    - id: nilxone-discord
      host: ${NILX_WEB_DOMAIN}
      pathPrefix: /discord/
      stripPrefix: true
      service: nilxone-discord
      upstream: nilxone-discord:1927
      health: /health
    - id: nilxone-web
      host: ${NILX_WEB_DOMAIN}
      pathPrefix: /
      stripPrefix: false
      service: nilxone-web
      upstream: nilxone-web:1927
      health: /health
    - id: market-bot-production
      host: ${MARKET_DOMAIN}
      pathPrefix: /bot/
      stripPrefix: true
      service: market-bot-production
      upstream: market-bot-production:1927
      health: /health
    - id: market-api-production
      host: ${MARKET_DOMAIN}
      pathPrefix: /
      stripPrefix: false
      service: market-api-production
      upstream: market-api-production:1927
      health: /health
