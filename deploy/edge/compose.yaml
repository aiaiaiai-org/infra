name: zero-x-infra-${EDGE_TARGET}

services:
  caddy:
    image: ${CADDY_IMAGE:-zero-x-infra-caddy-cloudflare:local}
    restart: unless-stopped
    init: true
    environment:
      MARKET_DOMAIN: ${MARKET_DOMAIN:-0xda-market.nilx.one}
      NILX_WEB_DOMAIN: ${NILX_WEB_DOMAIN:-nilx.one}
      NILX_BOND_DOMAIN: ${NILX_BOND_DOMAIN:-*.nilx.one}
      NILX_BOND_TRANSPORT: ${NILX_BOND_TRANSPORT:-bond_transport_cloudflare}
      CF_API_TOKEN: ${CF_API_TOKEN:?CF_API_TOKEN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - caddy
        - version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: ${EDGE_NETWORK:-nilx-edge}
    external: true

volumes:
  caddy_data:
    name: ${CADDY_DATA_VOLUME:-edge-prod-1-caddy-data}
    external: true
  caddy_config:
    name: ${CADDY_CONFIG_VOLUME:-edge-prod-1-caddy-config}
    external: true
