# © 2026 aiaiaiai · aiaiaiai.org
name: Deploy
run-name: Deploy ${{ inputs.target }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment surface
        required: true
        default: nilx-web
        type: choice
        options:
          - nilx-web
          - market
          - prism
          - aiaiaiai
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.target }}-${{ inputs.target == 'aiaiaiai' && 'edge-prod-2' || 'edge-prod-1' }}
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    if: ${{ inputs.target != 'aiaiaiai' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: edge-prod-1
    env:
      TARGET: ${{ inputs.target }}
      EDGE_NETWORK: nilx-edge
      CADDY_CONTAINER: edge-prod-1-caddy
      REMOTE_EDGE_DIR: .local/share/aiaiaiai-infra/edge
      SSH_PORT: ${{ vars.SSH_PORT || '1927' }}
    steps:
      - name: Validate credentials
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          case "$TARGET" in
            nilx-web|market) test -n "$CF_API_TOKEN" ;;
            prism) ;;
            *) exit 1 ;;
          esac
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))

      - name: Checkout infra
        if: ${{ inputs.target != 'prism' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" true

      - name: Prepare edge environment
        if: ${{ inputs.target != 'prism' }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          case "$TARGET" in
            nilx-web) EDGE_SCOPE=nilx-web ;;
            market) EDGE_SCOPE=market ;;
            *) exit 1 ;;
          esac
          umask 077
          {
            printf 'EDGE_TARGET=edge-prod-1\n'
            printf 'EDGE_SCOPE=%s\n' "$EDGE_SCOPE"
            printf 'EDGE_NETWORK=%s\n' "$EDGE_NETWORK"
            printf 'MARKET_DOMAIN=0xda-market.nilx.one\n'
            printf 'NILX_WEB_DOMAIN=nilx.one\n'
            printf 'NILX_BOND_DOMAIN=*.nilx.one\n'
            printf 'NILX_BOND_TRANSPORT=bond_transport_cloudflare\n'
            printf 'CADDY_IMAGE=zero-x-infra-caddy-cloudflare:%s\n' "$GITHUB_SHA"
            printf 'LEGACY_CADDY_CONTAINER=%s\n' "$CADDY_CONTAINER"
            printf 'RELEASE_SHA=%s\n' "$GITHUB_SHA"
            printf 'VERIFY_PUBLIC_HTTPS=1\n'
            printf 'CF_API_TOKEN=%s\n' "$CF_API_TOKEN"
          } > "$RUNNER_TEMP/edge.env"

      - name: Upload edge release
        if: ${{ inputs.target != 'prism' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_EDGE_DIR' && chmod 700 '$REMOTE_EDGE_DIR'"
          tar -C deploy/edge -czf - Caddyfile Dockerfile compose.yaml deploy.sh verify.sh check-public.sh check-upstreams.sh cloudflare-wildcard.sh |
            ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "tar -xzf - -C '$REMOTE_EDGE_DIR'"
          scp -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -P "$SSH_PORT" "$RUNNER_TEMP/edge.env" "$SSH_USER@$SSH_HOST:$REMOTE_EDGE_DIR/.env"

      - name: Activate edge
        if: ${{ inputs.target != 'prism' }}
        id: apply_edge
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$REMOTE_EDGE_DIR' && DEPLOY_MODE=activate bash ./deploy.sh"

      - name: Ensure nilx wildcard DNS
        if: ${{ inputs.target == 'nilx-web' }}
        id: wildcard_dns
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_WILDCARD_STATE_FILE: ${{ runner.temp }}/nilx-wildcard-state.json
        run: bash deploy/edge/cloudflare-wildcard.sh ensure "$CF_WILDCARD_STATE_FILE"

      - name: Verify edge
        if: ${{ inputs.target != 'prism' }}
        env:
          HEALTH_RETRY: 18
          HEALTH_RETRY_DELAY: 5
        run: bash deploy/edge/check-public.sh post-activation "$TARGET"

      - name: Checkout Prism
        if: ${{ inputs.target == 'prism' }}
        uses: actions/checkout@v7
        with:
          repository: aiaiaiai-org/prism-hubot
          ref: ${{ github.ref_name }}
          path: source
          persist-credentials: false

      - name: Resolve Prism commit
        if: ${{ inputs.target == 'prism' }}
        id: prism_source
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare Prism release archive
        if: ${{ inputs.target == 'prism' }}
        run: |
          set -Eeuo pipefail
          install -m 0700 -d "$RUNNER_TEMP/release"
          git -C source archive --format=tar.gz --output="$RUNNER_TEMP/release/release.tar.gz" HEAD
          test -s "$RUNNER_TEMP/release/release.tar.gz"

      - name: Checkout Prism deployment tooling
        if: ${{ inputs.target == 'prism' }}
        uses: actions/checkout@v7
        with:
          path: infra
          sparse-checkout: |
            deploy/workload/systemd-release.sh
          sparse-checkout-cone-mode: false

      - name: Upload Prism release
        if: ${{ inputs.target == 'prism' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          deployment_path=/opt/prism-hubot
          release_id="${{ steps.prism_source.outputs.sha }}"
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$deployment_path/.deploy' && chmod 700 '$deployment_path/.deploy'"
          scp -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -P "$SSH_PORT" infra/deploy/workload/systemd-release.sh "$SSH_USER@$SSH_HOST:$deployment_path/.deploy/systemd-release.sh"
          scp -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -P "$SSH_PORT" "$RUNNER_TEMP/release/release.tar.gz" "$SSH_USER@$SSH_HOST:$deployment_path/.deploy/$release_id.tar.gz"

      - name: Validate Prism release
        if: ${{ inputs.target == 'prism' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          deployment_path=/opt/prism-hubot
          release_id="${{ steps.prism_source.outputs.sha }}"
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_MODE=validate DEPLOY_PATH='$deployment_path' SERVICE_NAME='prism-hubot.service' RELEASE_ID='$release_id' KEEP_RELEASES='5' POST_ACTIVATE_COMMAND='bundle exec rake telegram:commands' RELEASE_ARCHIVE='$deployment_path/.deploy/$release_id.tar.gz' bash '$deployment_path/.deploy/systemd-release.sh'"

      - name: Activate Prism release
        if: ${{ inputs.target == 'prism' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          deployment_path=/opt/prism-hubot
          release_id="${{ steps.prism_source.outputs.sha }}"
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_MODE=activate DEPLOY_PATH='$deployment_path' SERVICE_NAME='prism-hubot.service' RELEASE_ID='$release_id' KEEP_RELEASES='5' POST_ACTIVATE_COMMAND='bundle exec rake telegram:commands' RELEASE_ARCHIVE='$deployment_path/.deploy/$release_id.tar.gz' bash '$deployment_path/.deploy/systemd-release.sh'"

      - name: Clean secret material
        if: always()
        run: rm -rf "$RUNNER_TEMP/release" "$RUNNER_TEMP/edge.env" "$HOME/.ssh/id_ed25519" "$RUNNER_TEMP/nilx-wildcard-state.json"

      - name: Publish summary
        if: always()
        run: |
          echo "target=$TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "result=${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  # aiaiaiai.org lives only on edge-prod-2 (contracts/edges/edge-prod-2.yaml).
  # Hosts, DNS zone and health URLs come from that merged contract.
  edge-prod-2:
    name: Deploy aiaiaiai edge
    if: ${{ inputs.target == 'aiaiaiai' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: edge-prod-2
    env:
      EDGE_TARGET: edge-prod-2
      REMOTE_EDGE_DIR: .local/share/aiaiaiai-infra/edge-prod-2
      SSH_PORT: ${{ vars.SSH_PORT || '22022' }}
      EDGE_PUBLIC_IPV4: ${{ vars.EDGE_PUBLIC_IPV4 }}
      EDGE_PUBLIC_IPV6: ${{ vars.EDGE_PUBLIC_IPV6 }}
    steps:
      - name: Validate credentials
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$CF_API_TOKEN"
          [[ "$EDGE_PUBLIC_IPV4" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::Set variable EDGE_PUBLIC_IPV4 in Environment edge-prod-2."; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))

      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Validate contracts
        run: ruby scripts/validate-contracts.rb

      - name: Resolve edge routes
        id: routes
        run: ruby scripts/edge-routes.rb "$EDGE_TARGET"

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" true

      - name: Prepare edge release
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UPSTREAM_URLS: ${{ steps.routes.outputs.upstream_urls }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -d "$RUNNER_TEMP/edge-release"
          cp deploy/edge-prod-2/{Caddyfile,compose.yaml,deploy.sh} deploy/edge/Dockerfile "$RUNNER_TEMP/edge-release/"
          {
            printf 'EDGE_TARGET=%s\n' "$EDGE_TARGET"
            printf 'PRISM_HUB_DOMAIN=hub.aiaiaiai.org\n'
            printf 'EDGE_TRANSPORT=transport_cloudflare\n'
            printf 'CADDY_IMAGE=aiaiaiai-infra-caddy-cloudflare:%s\n' "$GITHUB_SHA"
            printf 'RELEASE_SHA=%s\n' "$GITHUB_SHA"
            printf 'UPSTREAM_HEALTH_URLS="%s"\n' "$UPSTREAM_URLS"
            printf 'CF_API_TOKEN=%s\n' "$CF_API_TOKEN"
          } > "$RUNNER_TEMP/edge-release/.env"

      - name: Upload edge release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          release="$REMOTE_EDGE_DIR/releases/$GITHUB_SHA"
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "install -d -m 700 '$REMOTE_EDGE_DIR' '$REMOTE_EDGE_DIR/releases' && rm -rf '$release' && install -d -m 700 '$release'"
          tar -C "$RUNNER_TEMP/edge-release" -czf - . |
            ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "tar -xzf - -C '$release' && chmod 600 '$release/.env'"

      - name: Validate edge release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_MODE=validate bash '$REMOTE_EDGE_DIR/releases/$GITHUB_SHA/deploy.sh'"

      - name: Ensure edge DNS
        id: dns
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_NAME: ${{ steps.routes.outputs.zone }}
          HOSTS: ${{ steps.routes.outputs.hosts }}
        run: |
          set -Eeuo pipefail
          read -r -a hosts <<<"$HOSTS"
          bash deploy/edge-prod-2/cloudflare-dns.sh ensure "$RUNNER_TEMP/edge-prod-2-dns-state.json" "${hosts[@]}"

      - name: Activate edge
        id: activate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_MODE=activate bash '$REMOTE_EDGE_DIR/releases/$GITHUB_SHA/deploy.sh'"

      - name: Verify edge
        env:
          HEALTH_RETRY: 18
          HEALTH_RETRY_DELAY: 5
          PUBLIC_URLS: ${{ steps.routes.outputs.public_urls }}
        run: |
          set -Eeuo pipefail
          read -r -a urls <<<"$PUBLIC_URLS"
          bash deploy/edge-prod-2/check-public.sh "${urls[@]}"

      - name: Roll back edge
        if: ${{ failure() && steps.activate.outcome == 'success' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_MODE=rollback bash '$REMOTE_EDGE_DIR/releases/$GITHUB_SHA/deploy.sh'"

      - name: Roll back edge DNS
        if: ${{ failure() && steps.dns.outcome != 'skipped' }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash deploy/edge-prod-2/cloudflare-dns.sh rollback "$RUNNER_TEMP/edge-prod-2-dns-state.json"

      - name: Clean secret material
        if: always()
        run: rm -rf "$RUNNER_TEMP/edge-release" "$HOME/.ssh/id_ed25519" "$RUNNER_TEMP/edge-prod-2-dns-state.json"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "target=aiaiaiai"
            echo "edge=$EDGE_TARGET"
            echo "hosts=${{ steps.routes.outputs.hosts }}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "result=${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
