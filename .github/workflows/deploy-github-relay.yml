name: Deploy GitHub relay

# The Cloudflare Worker that carries GitHub webhook events (organizations or single repositories)
# to Discord and Telegram. Secrets live in the github-relay Environment; see
# deploy/github-relay/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-github-relay
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELAY_WEBHOOK_SECRET: ${{ secrets.RELAY_WEBHOOK_SECRET }}
      RELAY_ROUTES: ${{ secrets.RELAY_ROUTES }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    defaults:
      run:
        working-directory: deploy/github-relay

    steps:
      - name: Validate credentials
        working-directory: .
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$RELAY_WEBHOOK_SECRET"

      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate routes
        # The Worker's own parser; prints sources and destination kinds, never a URL or token.
        run: node src/check-routes.ts

      - name: Test relay
        run: node --test src/*.test.ts

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy

      - name: Upload Worker secrets
        run: |
          set -Eeuo pipefail
          umask 077
          secrets="$RUNNER_TEMP/relay-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          jq -n '{GITHUB_WEBHOOK_SECRET: env.RELAY_WEBHOOK_SECRET, RELAY_ROUTES: env.RELAY_ROUTES}
            + (if env.TELEGRAM_BOT_TOKEN != "" then {TELEGRAM_BOT_TOKEN: env.TELEGRAM_BOT_TOKEN} else {} end)' > "$secrets"
          npx --yes wrangler@4 secret bulk "$secrets"
