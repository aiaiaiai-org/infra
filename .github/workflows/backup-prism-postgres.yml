name: Backup Prism PostgreSQL

# Optional encrypted logical dump to independent S3-compatible storage.
# The initial h-ua-bot release does not require paid S3: no automatic schedule,
# manual dispatch only. No container mutation, no secrets in artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-prism-postgres
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted offsite database backup
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: edge-prod-2
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install age encryption tool
        run: |
          set -Eeuo pipefail
          # BEGIN install-age (identical in ci.yml, deploy-workload.yml and backup-prism-postgres.yml;
          # scripts/test-age-install.rb keeps them so and runs this block against stubbed apt)
          # Every apt call is bounded: a mirror whose DNS fails retries for minutes, longer than a job's
          # timeout, so without a cap the fallback below would never get to run.
          install_age() {
            timeout -k 5 90 sudo apt-get -o Acquire::Retries=2 update -qq &&
              timeout -k 5 90 sudo apt-get -o Acquire::Retries=2 install -y -qq --no-install-recommends age
          }
          if ! install_age; then
            # The runner's default mirror can be unreachable for a long while. Fall back to the
            # Ubuntu archive itself, with its signing key, for this one package.
            echo "::warning::the runner's apt mirror is unreachable; installing age from archive.ubuntu.com"
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu $(lsb_release -cs) universe" |
              sudo tee /etc/apt/sources.list.d/age-fallback.list >/dev/null
            timeout -k 5 120 sudo apt-get -o Acquire::Retries=2 update -qq -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/age-fallback.list -o Dir::Etc::sourceparts=-
            timeout -k 5 120 sudo apt-get -o Acquire::Retries=2 install -y -qq --no-install-recommends age
          fi
          command -v age >/dev/null
          # END install-age
          command -v aws
          age --version

      - name: Export and upload encrypted logical dump
        run: bash scripts/backup-prism-postgres.sh

      - name: Publish result
        if: always()
        run: |
          {
            echo '### Prism PostgreSQL offsite backup'
            echo
            echo '- Database: `prism_hub`'
            echo '- Source: `edge-prod-2 / prism-postgres`'
            echo '- Destination: external S3-compatible bucket'
            echo '- Encryption: age public-key, recovery private key held off-server'
            echo '- Status: `${{ job.status }}`'
            echo '- Note: upload success does not replace a restore drill'
          } >> "$GITHUB_STEP_SUMMARY"
