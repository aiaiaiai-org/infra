name: Diagnose 0x1 Telegram runtime on edge-dev-1 (read-only)

# Shows the state of the Telegram bot and login host containers and their
# recent warnings and errors. Read-only. Digits are masked so no Telegram
# chat, user or message id reaches the public run log.

on:
  workflow_dispatch:
    inputs:
      since:
        description: How far back to read the logs (Docker duration, e.g. 3h)
        type: string
        default: 3h
        required: true

permissions:
  contents: read

concurrency:
  group: diagnose-telegram-runtime-edge-dev-1
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: edge-dev-1
      deployment: false
    env:
      SINCE: ${{ inputs.since }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST_ED25519_PUBKEY: ${{ vars.SSH_HOST_ED25519_PUBKEY }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
    steps:
      - name: Validate pinned target and prepare SSH
        run: |
          set -Eeuo pipefail
          [[ "$SINCE" =~ ^[0-9]{1,3}[mh]$ ]] || { echo '::error::since must look like 30m or 3h'; exit 1; }
          test "$SSH_HOST" = 158.220.74.54
          test "$SSH_USER" = deploy
          test -n "$SSH_PRIVATE_KEY"
          [[ "$SSH_HOST_ED25519_PUBKEY" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/=]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          dir="$RUNNER_TEMP/telegram-runtime-ssh"
          install -d -m 0700 "$dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/id_ed25519"
          chmod 600 "$dir/id_ed25519"
          ssh-keygen -y -P '' -f "$dir/id_ed25519" >/dev/null
          if [[ "$SSH_PORT" == 22 ]]; then label="$SSH_HOST"; else label="[$SSH_HOST]:$SSH_PORT"; fi
          printf '%s %s\n' "$label" "$SSH_HOST_ED25519_PUBKEY" > "$dir/known_hosts"
          chmod 600 "$dir/known_hosts"

      - name: Inspect the Telegram runtime without changing anything
        run: |
          set -Eeuo pipefail
          dir="$RUNNER_TEMP/telegram-runtime-ssh"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=10 \
            -i "$dir/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$SINCE" <<'REMOTE'
          set -Eeuo pipefail
          since=$1
          test "$(hostname)" = edge-dev-1
          test "$(id -un)" = deploy
          for service in nilx-one-bot nilxone-telegram-login-host; do
            echo "=== $service ==="
            docker inspect -f 'running={{.State.Running}} restarts={{.RestartCount}} started={{.State.StartedAt}} exit={{.State.ExitCode}}' "$service" || true
            echo "--- warnings and errors since $since (digits masked) ---"
            docker logs --since "$since" "$service" 2>&1 \
              | grep -Ei 'warn|error|panic|refused|failed|conflict|timeout' \
              | sed -E 's/[0-9]{3,}/#/g' | tail -n 60 || true
            echo "--- log lines since $since: $(docker logs --since "$since" "$service" 2>&1 | wc -l) ---"
          done
          REMOTE

      - name: Remove ephemeral SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/telegram-runtime-ssh"
