# © 2026 aiaiaiai · aiaiaiai.org

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML contracts
        run: ruby scripts/validate-contracts.rb

      - name: Validate shell syntax
        # bash -n checks only its first file; the others would be arguments to it.
        run: |
          set -Eeuo pipefail
          for script in deploy/edge/deploy.sh deploy/edge/verify.sh deploy/edge/check-public.sh deploy/edge/check-upstreams.sh deploy/edge/cloudflare-wildcard.sh deploy/workload/deploy.sh deploy/workload/systemd-release.sh deploy/edge-aiaiaiai/deploy.sh deploy/edge-aiaiaiai/verify.sh deploy/edge-aiaiaiai/bootstrap-server.sh scripts/backup-prism-postgres.sh scripts/validate-market-postgres-deploy.sh; do
            bash -n "$script"
          done

      - name: Validate private Trading Lab placement and credential allowlist
        run: ruby scripts/test-market-trading-lab-contract.rb

      - name: Validate Market development Core workload contracts
        run: ruby scripts/test-market-core-development-contract.rb

      - name: Validate Market development Bot deployment
        run: ruby scripts/test-market-bot-development-contract.rb

      - name: Validate market production PostgreSQL isolation
        run: ruby scripts/test-market-postgres-contract.rb

      - name: Validate Prism backup contract
        run: |
          set -Eeuo pipefail
          ruby -e '
            require "yaml"
            workflow = YAML.load_file(".github/workflows/backup-prism-postgres.yml")
            abort "missing backup job" unless workflow.dig("jobs", "backup", "environment", "name") == "edge-prod-2"
            abort "must be scheduled" unless File.read(".github/workflows/backup-prism-postgres.yml").include?("schedule:")
            abort "missing encryption" unless File.read("scripts/backup-prism-postgres.sh").include?("age -r")
            abort "must verify offsite object" unless File.read("scripts/backup-prism-postgres.sh").include?("s3api head-object")
          '

      - name: Validate workload secret environment
        run: |
          set -Eeuo pipefail
          ruby -c scripts/workload-secret-env.rb
          mapping="$(printf 'POSTGRES_PASSWORD=PRISM_POSTGRES_PASSWORD\nPGPASSWORD=PRISM_POSTGRES_PASSWORD\n' | base64 -w0)"
          built="$(WORKLOAD_SECRETS="$mapping" ALL_SECRETS='{"PRISM_POSTGRES_PASSWORD":"pw=1","SSH_HOST":"x"}' ruby scripts/workload-secret-env.rb | base64 --decode)"
          test "$built" = "$(printf 'POSTGRES_PASSWORD=pw=1\nPGPASSWORD=pw=1')"
          # A named secret the Environment lacks, or leaves empty, stops the deployment.
          ! WORKLOAD_SECRETS="$mapping" ALL_SECRETS='{}' ruby scripts/workload-secret-env.rb 2>/dev/null
          ! WORKLOAD_SECRETS="$mapping" ALL_SECRETS='{"PRISM_POSTGRES_PASSWORD":""}' ruby scripts/workload-secret-env.rb 2>/dev/null
          ! WORKLOAD_SECRETS="$mapping" ALL_SECRETS='{"PRISM_POSTGRES_PASSWORD":"a\nb"}' ruby scripts/workload-secret-env.rb 2>/dev/null
          # An error names the secret, never its value.
          message="$(WORKLOAD_SECRETS="$mapping" ALL_SECRETS='{"PRISM_POSTGRES_PASSWORD":"leak-4a1f\nleak-9c2e"}' ruby scripts/workload-secret-env.rb 2>&1 || true)"
          grep -Fq 'PRISM_POSTGRES_PASSWORD' <<< "$message"
          ! grep -Fq 'leak-' <<< "$message"

      - name: Validate encrypted workload secret handoff
        run: ruby scripts/test-workload-secret-handoff.rb

      - name: Validate encrypted Identity provider handoff
        run: |
          ruby -c scripts/prepare-identity-provider-env.rb
          ruby scripts/test-identity-provider-env.rb

      - name: Verify age encryption to target SSH public key
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          umask 077
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/recipient"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/other"
          printf 'TOKEN=isolated\n' > "$RUNNER_TEMP/plain.env"
          age --armor --recipient "$(cat "$RUNNER_TEMP/recipient.pub")" \
            --output "$RUNNER_TEMP/payload.age" "$RUNNER_TEMP/plain.env"
          age --decrypt --identity "$RUNNER_TEMP/recipient" \
            --output "$RUNNER_TEMP/decrypted.env" "$RUNNER_TEMP/payload.age"
          cmp "$RUNNER_TEMP/plain.env" "$RUNNER_TEMP/decrypted.env"
          ! age --decrypt --identity "$RUNNER_TEMP/other" "$RUNNER_TEMP/payload.age" > /dev/null 2>&1
          ! grep -Fq 'TOKEN=isolated' "$RUNNER_TEMP/payload.age"

      - name: Validate workload placement resolver
        run: |
          set -Eeuo pipefail
          output="$(env -u GITHUB_OUTPUT ruby scripts/resolve-workload-target.rb nilxone-web)"
          grep -Fxq 'target=edge-prod-1' <<< "$output"
          grep -Fxq 'network=nilx-edge' <<< "$output"
          grep -Fxq 'alias=nilxone-web' <<< "$output"
          grep -Fxq 'port=1927' <<< "$output"
          grep -Fxq 'health=/health' <<< "$output"
          grep -Fxq 'prepare_env=deploy/web/prepare-map-runtime.sh' <<< "$output"
          grep -Fxq 'repository=nilx-one/web' <<< "$output"
          ! env -u GITHUB_OUTPUT ruby scripts/resolve-workload-target.rb does-not-exist 2>/dev/null

      - name: Validate identity workload contract
        run: |
          set -Eeuo pipefail
          output="$(env -u GITHUB_OUTPUT ruby scripts/resolve-workload-target.rb nilxone-identity)"
          grep -Fxq 'target=edge-prod-1' <<< "$output"
          grep -Fxq 'network=nilx-edge' <<< "$output"
          grep -Fxq 'alias=nilxone-identity' <<< "$output"
          grep -Fxq 'port=1927' <<< "$output"
          grep -Fxq 'health=/health' <<< "$output"
          grep -Fxq 'labels=b25lLm5pbHgucHJvZHVjdD0weDEKb25lLm5pbHguc2VydmljZT1pZGVudGl0eQpvbmUubmlseC5pZGVudGl0eS5jb250cmFjdD0xMAo=' <<< "$output"
          grep -Fxq 'volumes=bmlseG9uZS1pZGVudGl0eS1kYXRhOi9kYXRhCg==' <<< "$output"
          grep -Fxq 'prepare_env=services/identity/deploy/prepare-runtime-env.sh' <<< "$output"
          grep -Fxq 'repository=nilx-one/web' <<< "$output"

      - name: Validate systemd release workload contract
        run: |
          set -Eeuo pipefail
          output="$(env -u GITHUB_OUTPUT ruby scripts/resolve-workload-target.rb prism-hubot)"
          grep -Fxq 'target=edge-prod-1' <<< "$output"
          grep -Fxq 'runtime=systemd-release' <<< "$output"
          grep -Fxq 'repository=aiaiaiai-org/prism-hubot' <<< "$output"
          grep -Fxq 'deployment_path=/opt/prism-hubot' <<< "$output"
          grep -Fxq 'service=prism-hubot.service' <<< "$output"
          grep -Fxq 'release_retention=5' <<< "$output"
          grep -Fxq 'post_activate_command=bundle exec rake telegram:commands' <<< "$output"

      - name: Validate aiaiaiai edge workload contracts
        run: |
          set -Eeuo pipefail
          output="$(env -u GITHUB_OUTPUT ruby scripts/resolve-workload-target.rb prism-postgres)"
          grep -Fxq 'target=edge-prod-2' <<< "$output"
          grep -Fxq 'network=aiaiaiai-edge' <<< "$output"
          grep -Fxq 'port=1927' <<< "$output"
          grep -Fxq 'health_kind=tcp' <<< "$output"
          grep -Eq '^contract_image=postgres@sha256:[0-9a-f]{64}$' <<< "$output"
          test "$(sed -n 's/^secrets=//p' <<< "$output" | base64 --decode)" = 'POSTGRES_PASSWORD=PRISM_POSTGRES_PASSWORD'

          output="$(env -u GITHUB_OUTPUT ruby scripts/resolve-workload-target.rb prism-hub)"
          grep -Fxq 'target=edge-prod-2' <<< "$output"
          grep -Fxq 'network=aiaiaiai-edge' <<< "$output"
          grep -Fxq 'health=/healthz' <<< "$output"
          grep -Fxq 'health_kind=http' <<< "$output"
          grep -Fxq 'contract_image=' <<< "$output"
          secrets="$(sed -n 's/^secrets=//p' <<< "$output" | base64 --decode)"
          grep -Fxq 'PGPASSWORD=PRISM_POSTGRES_PASSWORD' <<< "$secrets"
          grep -Fxq 'SECRET_KEY_BASE=PRISM_HUB_SECRET_KEY_BASE' <<< "$secrets"
          grep -Fxq 'PRISM_BOT_DELIVERY_SECRET=PRISM_BOT_DELIVERY_SECRET' <<< "$secrets"
          environment="$(sed -n 's/^environment=//p' <<< "$output" | base64 --decode)"
          grep -Fxq 'PRISM_BOT_ORIGIN=https://api.aiaiaiai.org' <<< "$environment"
          grep -Fxq 'PRISM_BOT_PATH_PREFIX=/hua-bot' <<< "$environment"

          output="$(env -u GITHUB_OUTPUT ruby scripts/resolve-workload-target.rb h-ua-bot)"
          grep -Fxq 'target=edge-prod-2' <<< "$output"
          grep -Fxq 'network=aiaiaiai-edge' <<< "$output"
          grep -Fxq 'alias=h-ua-bot' <<< "$output"
          grep -Fxq 'port=1927' <<< "$output"
          grep -Fxq 'health=/health' <<< "$output"
          secrets="$(sed -n 's/^secrets=//p' <<< "$output" | base64 --decode)"
          grep -Fxq 'HUA_TELEGRAM_TOKEN=HUA_TELEGRAM_TOKEN' <<< "$secrets"
          grep -Fxq 'HUA_HUB_TOKEN=HUA_HUB_TOKEN' <<< "$secrets"
          grep -Fxq 'HUA_DELIVERY_SECRET=HUA_DELIVERY_SECRET' <<< "$secrets"
          vars="$(sed -n 's/^producer_environment=//p' <<< "$output" | base64 --decode)"
          grep -Fxq 'HUA_HUB_ORIGIN' <<< "$vars"
          grep -Fxq 'HUA_HUB_PROVIDER_SCOPE' <<< "$vars"
          grep -Fxq 'HUA_ALERT_CHANNEL' <<< "$vars"
          grep -Fxq 'HUA_SOURCES' <<< "$vars"
          test "$(grep -c '^HUA_' <<< "$vars")" -eq 4
          test -z "$(sed -n 's/^environment=//p' <<< "$output" | base64 --decode)"


          # The 0x1 edge is unchanged: its workloads still land on edge-prod-1 in nilx-edge.
          output="$(env -u GITHUB_OUTPUT ruby scripts/resolve-workload-target.rb nilxone-web)"
          grep -Fxq 'target=edge-prod-1' <<< "$output"
          grep -Fxq 'network=nilx-edge' <<< "$output"

      - name: Validate producer-owned runtime variable envelope
        run: |
          set -Eeuo pipefail
          output="$(env -u GITHUB_OUTPUT ruby scripts/resolve-workload-target.rb h-ua-bot)"
          secret_names="$(sed -n 's/^secrets=//p' <<< "$output")"
          variable_names="$(sed -n 's/^producer_environment=//p' <<< "$output")"
          source_file="$(mktemp)"
          trap 'rm -f "$source_file"' EXIT
          cat > "$source_file" <<'EOF'
          HUA_TELEGRAM_TOKEN=ci-telegram-token
          HUA_HUB_TOKEN=ci-hub-token
          HUA_DELIVERY_SECRET=ci-delivery-secret
          HUA_HUB_ORIGIN=https://api.aiaiaiai.org/prism-hub
          HUA_HUB_PROVIDER_SCOPE=h-ua-bot
          HUA_ALERT_CHANNEL=alerts
          HUA_SOURCES=vanek_nikolaev
          EOF
          assembled="$(WORKLOAD=h-ua-bot WORKLOAD_SECRETS="$secret_names" \
            WORKLOAD_PRODUCER_ENVIRONMENT="$variable_names" \
            WORKLOAD_SECRET_SOURCE_FILE="$source_file" \
            ruby scripts/workload-secret-env.rb | base64 --decode)"
          test "$(wc -l <<< "$assembled")" -eq 7
          grep -Fxq 'HUA_HUB_ORIGIN=https://api.aiaiaiai.org/prism-hub' <<< "$assembled"
          grep -Fxq 'HUA_SOURCES=vanek_nikolaev' <<< "$assembled"
          sed -i '/^HUA_SOURCES=/d' "$source_file"
          if WORKLOAD=h-ua-bot WORKLOAD_SECRETS="$secret_names" \
            WORKLOAD_PRODUCER_ENVIRONMENT="$variable_names" \
            WORKLOAD_SECRET_SOURCE_FILE="$source_file" \
            ruby scripts/workload-secret-env.rb >/dev/null 2>&1; then
            echo "::error::Missing producer variable must fail." >&2
            exit 1
          fi
          printf 'EXTRA_UNREVIEWED=bad\n' >> "$source_file"
          if WORKLOAD=h-ua-bot WORKLOAD_SECRETS="$secret_names" \
            WORKLOAD_PRODUCER_ENVIRONMENT="$variable_names" \
            WORKLOAD_SECRET_SOURCE_FILE="$source_file" \
            ruby scripts/workload-secret-env.rb >/dev/null 2>&1; then
            echo "::error::Unexpected producer key must fail." >&2
            exit 1
          fi

      - name: Validate aiaiaiai edge Caddy and Compose
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --env PRISM_API_DOMAIN=api.aiaiaiai.org \
            --volume "$PWD/deploy/edge-aiaiaiai/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
          test "$(grep -Fc 'reverse_proxy prism-hub:1927' deploy/edge-aiaiaiai/Caddyfile)" -eq 1
          # Nothing of the 0x1 product is routed from the aiaiaiai edge, and the reverse.
          ! grep -Eq 'nilx|nilxone|market' deploy/edge-aiaiaiai/Caddyfile
          ! grep -Fq 'prism-hub' deploy/edge/Caddyfile
          cp deploy/edge-aiaiaiai/env.example deploy/edge-aiaiaiai/.env
          docker compose --file deploy/edge-aiaiaiai/compose.yaml --env-file deploy/edge-aiaiaiai/.env config --quiet

      - name: Validate scoped upstream isolation
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker rm --force infra-ci-scope-nilxone >/dev/null 2>&1 || true
            docker network rm infra-ci-scope >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create infra-ci-scope >/dev/null
          docker run --detach --name infra-ci-scope-nilxone \
            --network infra-ci-scope \
            --network-alias nilxone-web \
            --network-alias nilxone-telegram \
            --network-alias nilxone-discord \
            python:3.13-alpine sh -ec \
            "mkdir -p /srv; printf 'ok\n' > /srv/health; python3 -m http.server 1927 --bind 0.0.0.0 --directory /srv" >/dev/null

          for _ in $(seq 1 20); do
            if docker exec infra-ci-scope-nilxone wget -q -T 1 -O- http://127.0.0.1:1927/health | grep -qx ok; then
              break
            fi
            sleep 1
          done
          docker exec infra-ci-scope-nilxone wget -q -T 1 -O- http://127.0.0.1:1927/health | grep -qx ok

          EDGE_NETWORK=infra-ci-scope bash deploy/edge/check-upstreams.sh nilx-web

          if EDGE_NETWORK=infra-ci-scope bash deploy/edge/check-upstreams.sh market > /tmp/market-scope.log 2>&1; then
            echo "market scope unexpectedly passed without market upstreams" >&2
            exit 1
          fi
          grep -Fq 'market-api-production' /tmp/market-scope.log

      - name: Build Cloudflare-enabled Caddy artifact
        run: |
          set -Eeuo pipefail
          docker build --file deploy/edge/Dockerfile --tag infra-edge-caddy:ci deploy/edge
          docker run --rm infra-edge-caddy:ci caddy list-modules | grep -Fx 'dns.providers.cloudflare'
          docker save infra-edge-caddy:ci | gzip > edge-caddy-image.tar.gz

      - name: Validate Compose contract
        run: |
          cp deploy/edge/env.example deploy/edge/.env
          sed -i 's/^CF_API_TOKEN=.*/CF_API_TOKEN=0123456789abcdef0123456789abcdef01234567/' deploy/edge/.env
          docker compose --file deploy/edge/compose.yaml --env-file deploy/edge/.env config --quiet

      - name: Validate Caddy contract
        run: |
          docker run --rm \
            --env CF_API_TOKEN=0123456789abcdef0123456789abcdef01234567 \
            --env MARKET_DOMAIN=0xda-market.nilx.one \
            --env NILX_WEB_DOMAIN=nilx.one \
            --env NILX_BOND_DOMAIN=*.nilx.one \
            --env NILX_BOND_TRANSPORT=bond_transport_cloudflare \
            --volume "$PWD/deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro" \
            infra-edge-caddy:ci \
            caddy validate --config /etc/caddy/Caddyfile
          test "$(grep -Fc 'reverse_proxy market-api-production:10000' deploy/edge/Caddyfile)" -eq 1
          test "$(grep -Fc 'reverse_proxy market-bot-production:10000' deploy/edge/Caddyfile)" -eq 1
          test "$(grep -Fc 'reverse_proxy market-bot-development:10000' deploy/edge/Caddyfile)" -eq 1
          test "$(grep -Fc 'reverse_proxy nilxone-web:1927' deploy/edge/Caddyfile)" -eq 3
          grep -Fq 'handle @market_web' deploy/edge/Caddyfile
          test "$(grep -Fc 'reverse_proxy nilxone-telegram:1927' deploy/edge/Caddyfile)" -eq 1
          test "$(grep -Fc 'reverse_proxy nilxone-discord:1927' deploy/edge/Caddyfile)" -eq 1
          grep -Fq '{$NILX_WEB_DOMAIN:nilx.one}' deploy/edge/Caddyfile
          grep -Fq '{$NILX_BOND_DOMAIN:*.nilx.one}' deploy/edge/Caddyfile
          grep -Fq 'import {$NILX_BOND_TRANSPORT:bond_transport}' deploy/edge/Caddyfile
          grep -Fq 'dns cloudflare {env.CF_API_TOKEN}' deploy/edge/Caddyfile
          ! grep -Fq '0x1.nilx.one' deploy/edge/Caddyfile
          ! grep -Eq 'reverse_proxy api:10000|reverse_proxy market-bot:10000|infra-bot' deploy/edge/Caddyfile

      - name: Preserve verified Caddy artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-caddy-${{ github.sha }}
          path: edge-caddy-image.tar.gz
          retention-days: 1

  github-relay:
    name: GitHub relay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test relay
        run: node --test deploy/github-relay/src/*.test.ts

  routing:
    name: Routing smoke
    needs:
      - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reuse verified Caddy artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-caddy-${{ github.sha }}

      - name: Load verified Caddy artifact
        run: gzip -dc edge-caddy-image.tar.gz | docker load

      - name: Start isolated edge fixture
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker logs infra-ci-caddy >&2 || true
            docker rm --force \
              infra-ci-caddy \
              infra-ci-market-api \
              infra-ci-market-bot \
              infra-ci-market-bot-test \
              infra-ci-nilxone-web \
              infra-ci-nilxone-telegram \
              infra-ci-nilxone-discord >/dev/null 2>&1 || true
            docker network rm infra-ci-edge >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create infra-ci-edge >/dev/null

          start_fixture() {
            local name="$1"
            local alias="$2"
            local port="$3"
            local body="$4"
            docker run --detach --name "$name" \
              --network infra-ci-edge --network-alias "$alias" \
              python:3.13-alpine sh -ec \
              "mkdir -p /srv; printf '%s' '$body' > /srv/health; python3 -m http.server '$port' --bind 0.0.0.0 --directory /srv" >/dev/null
          }

          start_fixture infra-ci-market-api market-api-production 10000 market-api-production
          start_fixture infra-ci-market-bot market-bot-production 10000 market-bot-production
          start_fixture infra-ci-market-bot-test market-bot-development 10000 market-bot-development
          start_fixture infra-ci-nilxone-web nilxone-web 1927 nilxone-web
          start_fixture infra-ci-nilxone-telegram nilxone-telegram 1927 nilxone-telegram
          start_fixture infra-ci-nilxone-discord nilxone-discord 1927 nilxone-discord

          wait_fixture() {
            local name="$1"
            local port="$2"
            local body="$3"
            for _ in $(seq 1 30); do
              if docker exec "$name" wget -q -T 1 -O- "http://127.0.0.1:${port}/health" | grep -qx "$body"; then
                return 0
              fi
              sleep 1
            done
            docker exec "$name" wget -q -T 1 -O- "http://127.0.0.1:${port}/health" | grep -qx "$body"
          }

          wait_fixture infra-ci-market-api 10000 market-api-production
          wait_fixture infra-ci-market-bot 10000 market-bot-production
          wait_fixture infra-ci-market-bot-test 10000 market-bot-development
          wait_fixture infra-ci-nilxone-web 1927 nilxone-web
          wait_fixture infra-ci-nilxone-telegram 1927 nilxone-telegram
          wait_fixture infra-ci-nilxone-discord 1927 nilxone-discord

          docker run --detach --name infra-ci-caddy \
            --network infra-ci-edge \
            --publish 18080:80 \
            --env CF_API_TOKEN=0123456789abcdef0123456789abcdef01234567 \
            --env MARKET_DOMAIN=http://market.localhost \
            --env NILX_WEB_DOMAIN=http://nilx.localhost \
            --env NILX_BOND_DOMAIN=http://bond.nilx.localhost \
            --env NILX_BOND_TRANSPORT=bond_transport \
            --volume "$PWD/deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro" \
            infra-edge-caddy:ci \
            caddy run --config /etc/caddy/Caddyfile >/dev/null

          check_route() {
            local host="$1"
            local path="$2"
            local expected="$3"
            for _ in $(seq 1 30); do
              if curl --fail --silent --show-error \
                --resolve "${host}:18080:127.0.0.1" \
                "http://${host}:18080${path}" | grep -qx "$expected"; then
                return 0
              fi
              sleep 1
            done
            curl --fail --silent --show-error \
              --resolve "${host}:18080:127.0.0.1" \
              "http://${host}:18080${path}" | grep -qx "$expected"
          }

          check_route market.localhost /health market-api-production
          check_route market.localhost /bot/health market-bot-production
          check_route market.localhost /bot-test/health market-bot-development
          check_route nilx.localhost /health nilxone-web
          check_route nilx.localhost /telegram/health nilxone-telegram
          check_route nilx.localhost /discord/health nilxone-discord
          check_route bond.nilx.localhost /health nilxone-web

  routing-aiaiaiai:
    name: Routing smoke (aiaiaiai edge)
    needs:
      - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Route through the aiaiaiai edge
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker logs infra-ci-aiaiaiai-caddy >&2 || true
            docker rm --force infra-ci-aiaiaiai-caddy infra-ci-prism-hub infra-ci-h-ua-bot >/dev/null 2>&1 || true
            docker network rm infra-ci-aiaiaiai-edge >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create infra-ci-aiaiaiai-edge >/dev/null
          docker run --detach --name infra-ci-prism-hub \
            --network infra-ci-aiaiaiai-edge --network-alias prism-hub \
            python:3.13-alpine sh -ec \
            "mkdir -p /srv/api/v1; printf prism-hub > /srv/healthz; printf channels > /srv/api/v1/channels; python3 -m http.server 1927 --bind 0.0.0.0 --directory /srv" >/dev/null

          docker run --detach --name infra-ci-h-ua-bot \
            --network infra-ci-aiaiaiai-edge --network-alias h-ua-bot \
            python:3.13-alpine sh -ec \
            "mkdir -p /srv/api/v1; printf h-ua-bot > /srv/health; printf delivered > /srv/api/v1/delivery; python3 -m http.server 1927 --bind 0.0.0.0 --directory /srv" >/dev/null

          for _ in $(seq 1 30); do
            docker exec infra-ci-prism-hub wget -q -T 1 -O- http://127.0.0.1:1927/healthz | grep -qx prism-hub && break
            sleep 1
          done

          docker run --detach --name infra-ci-aiaiaiai-caddy \
            --network infra-ci-aiaiaiai-edge \
            --publish 18081:80 \
            --env PRISM_API_DOMAIN=http://api.localhost \
            --volume "$PWD/deploy/edge-aiaiaiai/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy run --config /etc/caddy/Caddyfile >/dev/null

          request() {
            curl --silent --output /tmp/body --write-out '%{http_code}' \
              --resolve "api.localhost:18081:127.0.0.1" "http://api.localhost:18081$1"
          }
          for _ in $(seq 1 30); do
            [[ "$(request /prism-hub/healthz)" == 200 ]] && break
            sleep 1
          done

          # The prefix is stripped on the way to prism-hub.
          test "$(request /prism-hub/healthz)" = 200 && grep -qx prism-hub /tmp/body
          test "$(request /prism-hub/api/v1/channels)" = 200 && grep -qx channels /tmp/body
          test "$(request /prism-hub)" = 308
          test "$(request /hua-bot/health)" = 200 && grep -qx h-ua-bot /tmp/body
          test "$(request /hua-bot/api/v1/delivery)" = 200 && grep -qx delivered /tmp/body
          test "$(request /hua-bot)" = 308
          test "$(request /hua-bot-other/health)" = 404
          test "$(request /hua-bot/prism-hub/healthz)" = 404
          test "$(request /h-ua-bot/health)" = 200 && grep -qx h-ua-bot /tmp/body
          test "$(request /api/v1/delivery)" = 200 && grep -qx delivered /tmp/body
          # Nothing else on the host is served.
          test "$(request /)" = 404
          test "$(request /healthz)" = 404

