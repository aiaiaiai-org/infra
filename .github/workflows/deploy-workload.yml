name: Deploy workload

on:
  repository_dispatch:
    types: [deploy-workload]
  # For workloads no product repository dispatches, such as a database whose image is pinned in
  # its contract.
  workflow_dispatch:
    inputs:
      workload:
        description: Workload identifier
        required: true
        type: string
      image:
        description: Immutable image reference (omit when the contract pins one)
        required: false
        type: string
      ref:
        description: Source release ref
        required: false
        type: string
  workflow_call:
    inputs:
      workload:
        description: Workload identifier
        required: true
        type: string
      image:
        description: Immutable image reference
        required: false
        type: string
      source_repository:
        description: Source repository for release-backed workloads
        required: false
        type: string
      ref:
        description: Source release ref
        required: false
        type: string
      telegram_oidc_client_id:
        description: Telegram OIDC client ID
        required: false
        type: string
      discord_client_id:
        description: Discord client ID
        required: false
        type: string
    secrets:
      TELOXIDE_TOKEN:
        required: false
      TELEGRAM_OIDC_CLIENT_SECRET:
        required: false
      DISCORD_CLIENT_SECRET:
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-workload-${{ inputs.workload || github.event.client_payload.workload }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve placement from contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      runtime: ${{ steps.resolve.outputs.runtime }}
      repository: ${{ steps.resolve.outputs.repository }}
      network: ${{ steps.resolve.outputs.network }}
      alias: ${{ steps.resolve.outputs.alias }}
      port: ${{ steps.resolve.outputs.port }}
      health: ${{ steps.resolve.outputs.health }}
      health_kind: ${{ steps.resolve.outputs.health_kind }}
      secrets: ${{ steps.resolve.outputs.secrets }}
      environment: ${{ steps.resolve.outputs.environment }}
      labels: ${{ steps.resolve.outputs.labels }}
      volumes: ${{ steps.resolve.outputs.volumes }}
      deployment_path: ${{ steps.resolve.outputs.deployment_path }}
      service: ${{ steps.resolve.outputs.service }}
      release_retention: ${{ steps.resolve.outputs.release_retention }}
      post_activate_command: ${{ steps.resolve.outputs.post_activate_command }}
      prepare_env: ${{ steps.resolve.outputs.prepare_env }}
      image: ${{ steps.image.outputs.image }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Validate dispatch payload
        env:
          WORKLOAD: ${{ inputs.workload || github.event.client_payload.workload }}
          IMAGE_REF: ${{ inputs.image || github.event.client_payload.image }}
          RELEASE_REF: ${{ inputs.ref || github.event.client_payload.ref || 'master' }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKLOAD" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::invalid workload identifier"; exit 1; }
          if [[ -n "$IMAGE_REF" ]]; then
            [[ "$IMAGE_REF" =~ ^[a-z0-9.-]+(/[a-z0-9._-]+)*(:[A-Za-z0-9_.-]+|@sha256:[0-9a-f]{64})$ ]] || { echo "::error::invalid image reference"; exit 1; }
          fi
          [[ "$RELEASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid release ref"; exit 1; }

      - name: Checkout infra
        uses: actions/checkout@v7

      - name: Resolve workload
        id: resolve
        env:
          WORKLOAD: ${{ inputs.workload || github.event.client_payload.workload }}
        run: ruby scripts/resolve-workload-target.rb "$WORKLOAD"

      - name: Pass image
        id: image
        env:
          IMAGE_REF: ${{ inputs.image || github.event.client_payload.image }}
          CONTRACT_IMAGE: ${{ steps.resolve.outputs.contract_image }}
        run: |
          set -Eeuo pipefail
          # A contract that pins its image is the release identity; a caller cannot replace it.
          if [[ -n "$CONTRACT_IMAGE" ]]; then
            if [[ -n "$IMAGE_REF" && "$IMAGE_REF" != "$CONTRACT_IMAGE" ]]; then
              echo "::error::this workload's image is pinned by its contract"
              exit 1
            fi
            IMAGE_REF="$CONTRACT_IMAGE"
          fi
          echo "image=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Pass ref
        id: ref
        env:
          RELEASE_REF: ${{ inputs.ref || github.event.client_payload.ref || 'master' }}
        run: echo "ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to resolved target
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ needs.resolve.outputs.target }}
    env:
      WORKLOAD: ${{ inputs.workload || github.event.client_payload.workload }}
      RUNTIME: ${{ needs.resolve.outputs.runtime }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository || needs.resolve.outputs.repository }}
      IMAGE_REF: ${{ needs.resolve.outputs.image }}
      RELEASE_REF: ${{ needs.resolve.outputs.ref }}
      EDGE_NETWORK: ${{ needs.resolve.outputs.network }}
      WORKLOAD_ALIAS: ${{ needs.resolve.outputs.alias }}
      WORKLOAD_PORT: ${{ needs.resolve.outputs.port }}
      WORKLOAD_HEALTH: ${{ needs.resolve.outputs.health }}
      WORKLOAD_HEALTH_KIND: ${{ needs.resolve.outputs.health_kind }}
      WORKLOAD_SECRETS: ${{ needs.resolve.outputs.secrets }}
      WORKLOAD_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      WORKLOAD_LABELS: ${{ needs.resolve.outputs.labels }}
      WORKLOAD_VOLUMES: ${{ needs.resolve.outputs.volumes }}
      DEPLOYMENT_PATH: ${{ needs.resolve.outputs.deployment_path }}
      SERVICE_NAME: ${{ needs.resolve.outputs.service }}
      KEEP_RELEASES: ${{ needs.resolve.outputs.release_retention }}
      POST_ACTIVATE_COMMAND: ${{ needs.resolve.outputs.post_activate_command }}
      PREPARE_ENV: ${{ needs.resolve.outputs.prepare_env }}
      REMOTE_WORKLOAD_DIR: .local/share/aiaiaiai-infra/workloads/${{ inputs.workload || github.event.client_payload.workload }}
      SSH_PORT: ${{ vars.SSH_PORT || '22022' }}
      PROVIDER_TELOXIDE_TOKEN: ${{ secrets.TELOXIDE_TOKEN }}
      PROVIDER_TELEGRAM_OIDC_CLIENT_ID: ${{ inputs.telegram_oidc_client_id || github.event.client_payload.telegram_oidc_client_id }}
      PROVIDER_TELEGRAM_OIDC_CLIENT_SECRET: ${{ secrets.TELEGRAM_OIDC_CLIENT_SECRET }}
      PROVIDER_DISCORD_CLIENT_ID: ${{ inputs.discord_client_id || github.event.client_payload.discord_client_id }}
      PROVIDER_DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}

    steps:
      - name: Validate SSH credentials
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" true

      - name: Checkout source release
        if: ${{ needs.resolve.outputs.runtime == 'systemd-release' || needs.resolve.outputs.prepare_env != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.ref }}
          path: source
          persist-credentials: false

      - name: Resolve source commit
        if: ${{ needs.resolve.outputs.runtime == 'systemd-release' }}
        id: source
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare container environment
        if: ${{ needs.resolve.outputs.runtime == 'container' }}
        run: |
          set -Eeuo pipefail
          {
            printf 'WORKLOAD=%s\n' "$WORKLOAD"
            printf 'IMAGE_REF=%s\n' "$IMAGE_REF"
            printf 'EDGE_NETWORK=%s\n' "$EDGE_NETWORK"
            printf 'WORKLOAD_ALIAS=%s\n' "$WORKLOAD_ALIAS"
            printf 'WORKLOAD_PORT=%s\n' "$WORKLOAD_PORT"
            printf 'WORKLOAD_HEALTH=%s\n' "$WORKLOAD_HEALTH"
            printf 'WORKLOAD_HEALTH_KIND=%s\n' "$WORKLOAD_HEALTH_KIND"
            printf 'WORKLOAD_ENVIRONMENT=%s\n' "$WORKLOAD_ENVIRONMENT"
            printf 'WORKLOAD_LABELS=%s\n' "$WORKLOAD_LABELS"
            printf 'WORKLOAD_VOLUMES=%s\n' "$WORKLOAD_VOLUMES"
          } > "$RUNNER_TEMP/workload.env"
          if [[ -n "$PREPARE_ENV" && "$WORKLOAD" == "nilxone-identity" ]]; then
            test -n "$PROVIDER_TELOXIDE_TOKEN"
            test -n "$PROVIDER_TELEGRAM_OIDC_CLIENT_ID"
            test -n "$PROVIDER_TELEGRAM_OIDC_CLIENT_SECRET"
            test -n "$PROVIDER_DISCORD_CLIENT_ID"
            test -n "$PROVIDER_DISCORD_CLIENT_SECRET"
          fi

      - name: Prepare systemd release
        if: ${{ needs.resolve.outputs.runtime == 'systemd-release' }}
        run: |
          set -Eeuo pipefail
          install -m 0700 -d "$RUNNER_TEMP/release"
          git -C source archive --format=tar.gz --output="$RUNNER_TEMP/release/release.tar.gz" HEAD
          test -s "$RUNNER_TEMP/release/release.tar.gz"

      - name: Prepare target runtime environment
        if: ${{ needs.resolve.outputs.prepare_env != '' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          test -f "source/${PREPARE_ENV}"
          if [[ "$WORKLOAD" == "nilxone-identity" ]]; then
            provider_env="$(printf '%s\n' \
              "PUBLIC_ORIGIN=https://nilx.one" \
              "TELOXIDE_TOKEN=$PROVIDER_TELOXIDE_TOKEN" \
              "TELEGRAM_OIDC_CLIENT_ID=$PROVIDER_TELEGRAM_OIDC_CLIENT_ID" \
              "TELEGRAM_OIDC_CLIENT_SECRET=$PROVIDER_TELEGRAM_OIDC_CLIENT_SECRET" \
              "DISCORD_CLIENT_ID=$PROVIDER_DISCORD_CLIENT_ID" \
              "DISCORD_CLIENT_SECRET=$PROVIDER_DISCORD_CLIENT_SECRET")"
            printf '%s' "$provider_env" > "$RUNNER_TEMP/identity-provider.env"
          else
            : > "$RUNNER_TEMP/identity-provider.env"
          fi
          test -s "$RUNNER_TEMP/identity-provider.env"
          chmod 600 "$RUNNER_TEMP/identity-provider.env"
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_WORKLOAD_DIR' && chmod 700 '$REMOTE_WORKLOAD_DIR'"
          scp -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -P "$SSH_PORT" "source/${PREPARE_ENV}" "$SSH_USER@$SSH_HOST:$REMOTE_WORKLOAD_DIR/prepare-runtime-env.sh"
          scp -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -P "$SSH_PORT" "$RUNNER_TEMP/identity-provider.env" "$SSH_USER@$SSH_HOST:$REMOTE_WORKLOAD_DIR/provider.env"
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "chmod 700 '$REMOTE_WORKLOAD_DIR/prepare-runtime-env.sh' && chmod 600 '$REMOTE_WORKLOAD_DIR/provider.env' && '$REMOTE_WORKLOAD_DIR/prepare-runtime-env.sh' '$REMOTE_WORKLOAD_DIR/runtime.env' '$REMOTE_WORKLOAD_DIR/provider.env' && rm -f '$REMOTE_WORKLOAD_DIR/provider.env' '$REMOTE_WORKLOAD_DIR/prepare-runtime-env.sh' && test -s '$REMOTE_WORKLOAD_DIR/runtime.env'"
          rm -f "$RUNNER_TEMP/identity-provider.env"
          if [[ "$WORKLOAD" == "nilxone-identity" ]]; then
            printf 'WORKLOAD_SECRET_ENV_FILE=runtime.env\n' >> "$RUNNER_TEMP/workload.env"
          fi
      - name: Checkout infra deployment tooling
        if: ${{ needs.resolve.outputs.runtime == 'container' || needs.resolve.outputs.runtime == 'systemd-release' }}
        uses: actions/checkout@v7
        with:
          path: infra
          sparse-checkout: |
            deploy/workload/deploy.sh
            deploy/workload/systemd-release.sh
            scripts/workload-secret-env.rb
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Prepare workload secrets
        if: ${{ needs.resolve.outputs.runtime == 'container' && needs.resolve.outputs.secrets != '' }}
        env:
          # Only this step sees the Environment's secrets; it keeps the ones the contract names.
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -Eeuo pipefail
          secret_env="$(ruby infra/scripts/workload-secret-env.rb)"
          printf 'WORKLOAD_SECRET_ENV=%s\n' "$secret_env" >> "$RUNNER_TEMP/workload.env"

      - name: Upload container deploy script
        if: ${{ needs.resolve.outputs.runtime == 'container' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_WORKLOAD_DIR' && chmod 700 '$REMOTE_WORKLOAD_DIR'"
          tar -C infra/deploy/workload -czf - deploy.sh | ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "tar -xzf - -C '$REMOTE_WORKLOAD_DIR'"
          scp -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -P "$SSH_PORT" "$RUNNER_TEMP/workload.env" "$SSH_USER@$SSH_HOST:$REMOTE_WORKLOAD_DIR/.env"
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "chmod 600 '$REMOTE_WORKLOAD_DIR/.env'; chmod 700 '$REMOTE_WORKLOAD_DIR/deploy.sh'"

      - name: Authenticate container registry
        if: ${{ needs.resolve.outputs.runtime == 'container' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER }}
          INFRA_DEPLOY_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GHCR_PULL_USER" || { echo "::error::Missing repository variable GHCR_PULL_USER." >&2; exit 1; }
          test -n "$INFRA_DEPLOY_TOKEN" || { echo "::error::Missing repository secret INFRA_DEPLOY_TOKEN." >&2; exit 1; }
          printf '%s' "$INFRA_DEPLOY_TOKEN" | ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "docker login ghcr.io -u '$GHCR_PULL_USER' --password-stdin"

      - name: Validate and activate container
        if: ${{ needs.resolve.outputs.runtime == 'container' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$REMOTE_WORKLOAD_DIR' && DEPLOY_MODE=validate bash ./deploy.sh"
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$REMOTE_WORKLOAD_DIR' && DEPLOY_MODE=activate bash ./deploy.sh"

      - name: Upload systemd release
        if: ${{ needs.resolve.outputs.runtime == 'systemd-release' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOYMENT_PATH/.deploy' && chmod 700 '$DEPLOYMENT_PATH/.deploy'"
          scp -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -P "$SSH_PORT"             infra/deploy/workload/systemd-release.sh "$SSH_USER@$SSH_HOST:$DEPLOYMENT_PATH/.deploy/systemd-release.sh"
          scp -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -P "$SSH_PORT" "$RUNNER_TEMP/release/release.tar.gz" "$SSH_USER@$SSH_HOST:$DEPLOYMENT_PATH/.deploy/${{ steps.source.outputs.sha }}.tar.gz"
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "chmod 700 '$DEPLOYMENT_PATH/.deploy/systemd-release.sh' && chmod 600 '$DEPLOYMENT_PATH/.deploy/${{ steps.source.outputs.sha }}.tar.gz'"

      - name: Validate systemd release
        if: ${{ needs.resolve.outputs.runtime == 'systemd-release' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_MODE=validate DEPLOY_PATH='$DEPLOYMENT_PATH' SERVICE_NAME='$SERVICE_NAME' RELEASE_ID='${{ steps.source.outputs.sha }}' KEEP_RELEASES='$KEEP_RELEASES' POST_ACTIVATE_COMMAND='$POST_ACTIVATE_COMMAND' RELEASE_ARCHIVE='$DEPLOYMENT_PATH/.deploy/${{ steps.source.outputs.sha }}.tar.gz' bash '$DEPLOYMENT_PATH/.deploy/systemd-release.sh'"

      - name: Activate systemd release
        if: ${{ needs.resolve.outputs.runtime == 'systemd-release' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_MODE=activate DEPLOY_PATH='$DEPLOYMENT_PATH' SERVICE_NAME='$SERVICE_NAME' RELEASE_ID='${{ steps.source.outputs.sha }}' KEEP_RELEASES='$KEEP_RELEASES' RELEASE_ARCHIVE='$DEPLOYMENT_PATH/.deploy/${{ steps.source.outputs.sha }}.tar.gz' bash '$DEPLOYMENT_PATH/.deploy/systemd-release.sh'"

      - name: Clean runner secret material
        if: always()
        run: rm -f "$RUNNER_TEMP/workload.env"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Workload deployment"
            printf '%s\n' "- workload: %s" "$WORKLOAD"
            printf '%s\n' "- runtime: %s" "$RUNTIME"
            printf '%s\n' "- target: %s" "${{ needs.resolve.outputs.target }}"
            if [[ "$RUNTIME" == "container" ]]; then
              printf '%s\n' "- image: %s" "$IMAGE_REF"
            else
              printf '%s\n' "- repository: %s" "$SOURCE_REPOSITORY"
              printf '%s\n' "- ref: %s" "$RELEASE_REF"
              printf '%s\n' "- release: %s" "${{ steps.source.outputs.sha }}"
            fi
            printf '%s\n' "- result: %s" "${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
