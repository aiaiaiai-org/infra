name: Activate 0x1 Telegram runtime on edge-dev-1

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Repair Identity, validate prerequisites or activate the staged release
        type: choice
        options: [repair-identity, validate, activate]
        default: validate
        required: true
      credential_run_id:
        description: Successful Package 0x1 Telegram credential run ID from nilx-one/bot
        type: string
        required: false

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: stage-telegram-runtime-edge-dev-1
  cancel-in-progress: false

jobs:
  runtime:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: edge-dev-1
      deployment: false
    env:
      OPERATION: ${{ inputs.operation }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST_ED25519_PUBKEY: ${{ vars.SSH_HOST_ED25519_PUBKEY }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pinned target and prepare SSH
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = 158.220.74.54
          test "$SSH_USER" = deploy
          test -n "$SSH_PRIVATE_KEY"
          [[ "$SSH_HOST_ED25519_PUBKEY" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/=]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          dir="$RUNNER_TEMP/telegram-runtime-ssh"
          install -d -m 0700 "$dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/id_ed25519"
          chmod 600 "$dir/id_ed25519"
          ssh-keygen -y -P '' -f "$dir/id_ed25519" >/dev/null
          if [[ "$SSH_PORT" == 22 ]]; then label="$SSH_HOST"; else label="[$SSH_HOST]:$SSH_PORT"; fi
          printf '%s %s\n' "$label" "$SSH_HOST_ED25519_PUBKEY" > "$dir/known_hosts"
          chmod 600 "$dir/known_hosts"
      - name: Verify Identity image with polling handoff
        if: inputs.operation == 'repair-identity'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sha=4377be9e3b5540afacb70150324ae5b246a3c73c
          source_image=ghcr.io/nilx-one/0x1-identity
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null' EXIT
          manifest="$(docker buildx imagetools inspect "$source_image:$sha" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$manifest")"
          gh attestation verify "oci://$source_image@$digest" --repo nilx-one/web \
            --signer-workflow nilx-one/web/.github/workflows/package-identity-service.yml \
            --source-ref refs/heads/master --source-digest "$sha" --deny-self-hosted-runners
          echo "IDENTITY_IMAGE=$source_image@$digest" >> "$GITHUB_ENV"
      - name: Pull verified Identity image on edge-dev-1
        if: inputs.operation == 'repair-identity'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$IDENTITY_IMAGE" =~ ^ghcr\.io/nilx-one/0x1-identity@sha256:[0-9a-f]{64}$ ]]
          dir="$RUNNER_TEMP/telegram-runtime-ssh"
          printf '%s' "$GH_TOKEN" | ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=10 \
            -i "$dir/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -eu; umask 077; dir=\$(mktemp -d); trap 'rm -rf \"\$dir\"' EXIT; export DOCKER_CONFIG=\"\$dir\"; docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin >/dev/null; docker pull '$IDENTITY_IMAGE' >/dev/null"
      - name: Repair existing Identity on edge-dev-1
        if: inputs.operation == 'repair-identity'
        run: |
          set -Eeuo pipefail
          [[ "$IDENTITY_IMAGE" =~ ^ghcr\.io/nilx-one/0x1-identity@sha256:[0-9a-f]{64}$ ]]
          dir="$RUNNER_TEMP/telegram-runtime-ssh"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=10 \
            -i "$dir/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            bash -s -- "$IDENTITY_IMAGE" < deploy/telegram-runtime/repair-identity.sh
      - name: Fetch ciphertext from the approved Bot workflow
        if: inputs.operation != 'repair-identity'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.credential_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo '::error::Provide the Bot credential workflow run ID.'; exit 1; }
          api=repos/nilx-one/bot/actions/runs/$RUN_ID
          gh api "$api" | jq -e '
            .conclusion == "success" and .event == "workflow_dispatch" and
            .head_branch == "master" and .head_repository.full_name == "nilx-one/bot" and
            .path == ".github/workflows/package-telegram-credential.yml"
          ' >/dev/null
          artifact=$(gh api "$api/artifacts?name=telegram-credential-edge-dev-1" | jq -ce '
            [.artifacts[] | select(.expired == false and .name == "telegram-credential-edge-dev-1")] |
            select(length == 1) | .[0] | select(.digest | test("^sha256:[0-9a-f]{64}$"))
          ')
          id=$(jq -er '.id | tostring | select(test("^[0-9]+$"))' <<<"$artifact")
          digest=$(jq -er '.digest | sub("^sha256:"; "")' <<<"$artifact")
          dir="$RUNNER_TEMP/telegram-runtime-ssh"
          gh api "repos/nilx-one/bot/actions/artifacts/$id/zip" > "$dir/envelope.zip"
          printf '%s  %s\n' "$digest" "$dir/envelope.zip" | sha256sum -c -
          test "$(unzip -Z1 "$dir/envelope.zip")" = telegram-credential.age
          unzip -p "$dir/envelope.zip" telegram-credential.age > "$dir/telegram-credential.age"
          cp deploy/telegram-runtime/activate.sh "$dir/activate.sh"

      - name: Validate or activate Telegram runtime
        if: inputs.operation != 'repair-identity'
        run: |
          set -Eeuo pipefail
          case "$OPERATION" in validate|activate) ;; *) exit 2 ;; esac
          dir="$RUNNER_TEMP/telegram-runtime-ssh"
          tar -C "$dir" -cf - activate.sh telegram-credential.age | \
            ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=10 \
            -i "$dir/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -eu; umask 077; dir=\$(mktemp -d); trap 'rm -f -- \"\$dir/activate.sh\" \"\$dir/telegram-credential.age\"; rmdir -- \"\$dir\"' EXIT; tar -xf - -C \"\$dir\" -- activate.sh telegram-credential.age; bash \"\$dir/activate.sh\" '$OPERATION' \"\$dir/telegram-credential.age\""
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/telegram-runtime-ssh"
