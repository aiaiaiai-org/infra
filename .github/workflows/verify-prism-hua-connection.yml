# Safe manual check; does not release, write to DB, or send a Telegram message.
name: Verify h-ua delivery connection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prism-hua-readiness
  cancel-in-progress: false

jobs:
  handshake:
    name: Verify Hub and h-ua-bot routing and shared secret
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: edge-prod-2
    env:
      PRISM_BOT_DELIVERY_SECRET: ${{ secrets.PRISM_BOT_DELIVERY_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm configured transport without sending a message
        shell: bash
        run: bash scripts/check-prism-hua-handshake.sh
