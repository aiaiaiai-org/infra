# Safe manual health check; product-owned delivery credential lives in prism-hub.
name: Verify Prism Hub and h-ua-bot health

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prism-hua-readiness
  cancel-in-progress: false

jobs:
  handshake:
    name: Check Hub and h-ua-bot health without product secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: edge-prod-2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check public service health without sending a message
        shell: bash
        run: bash scripts/check-prism-hua-handshake.sh
