name: Deploy GitHub Discord relay

# The Cloudflare Worker behind the organization webhooks that post tasks to Discord.
# Secrets live in the github-discord-relay Environment; see deploy/github-discord-relay/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-github-discord-relay
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Discord relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-discord-relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: deploy/github-discord-relay

    steps:
      - name: Validate credentials
        working-directory: .
        env:
          RELAY_WEBHOOK_SECRET: ${{ secrets.RELAY_WEBHOOK_SECRET }}
          RELAY_ROUTES: ${{ secrets.RELAY_ROUTES }}
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$RELAY_WEBHOOK_SECRET"
          # Every route is an organization login mapped to a Discord webhook URL.
          jq -e 'type == "object" and length > 0 and all(.[]; .discord | type == "string" and startswith("https://discord.com/api/webhooks/"))' \
            <<< "$RELAY_ROUTES" > /dev/null

      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test relay
        run: node --test src/*.test.ts

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy

      - name: Upload Worker secrets
        env:
          RELAY_WEBHOOK_SECRET: ${{ secrets.RELAY_WEBHOOK_SECRET }}
          RELAY_ROUTES: ${{ secrets.RELAY_ROUTES }}
        run: |
          set -Eeuo pipefail
          umask 077
          secrets="$RUNNER_TEMP/relay-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          jq -n '{GITHUB_WEBHOOK_SECRET: env.RELAY_WEBHOOK_SECRET, RELAY_ROUTES: env.RELAY_ROUTES}' > "$secrets"
          npx --yes wrangler@4 secret bulk "$secrets"
