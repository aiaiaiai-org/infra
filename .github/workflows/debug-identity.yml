name: Debug identity workload

on:
  workflow_dispatch:
    inputs:
      tail_lines:
        description: Number of container log lines to tail
        required: false
        default: "200"

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect nilxone-identity container (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: edge-prod-1
    env:
      SSH_PORT: ${{ vars.SSH_PORT || '22022' }}
      TAIL_LINES: ${{ inputs.tail_lines }}
    steps:
      - name: Validate SSH credentials
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" true

      - name: Inspect container, volume, and recent logs
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh_run() {
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$1"
          }
          {
            echo '```'
            echo '## live public endpoint check (through Cloudflare/Caddy, like a browser)'
            ssh_run "curl -sS -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' https://nilx.one/api/v1/auth/native/context" || true
            echo
            echo '## docker ps'
            ssh_run "docker ps -a --filter name=nilxone-identity --format '{{.Names}}\t{{.Status}}\t{{.Image}}\t{{.RunningFor}}'" || true
            echo
            echo '## docker inspect: mounts + restart count'
            ssh_run "docker inspect nilxone-identity --format 'RestartCount={{.RestartCount}} Mounts={{json .Mounts}}'" || true
            echo
            echo '## docker volume inspect nilxone-identity-data'
            ssh_run "docker volume inspect nilxone-identity-data" || true
            echo
            echo '## /data listing inside the container'
            ssh_run "docker exec nilxone-identity ls -la /data" || true
            echo
            echo '## recent container logs (tail '"$TAIL_LINES"')'
            ssh_run "docker logs --tail '$TAIL_LINES' nilxone-identity 2>&1" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Clean SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
