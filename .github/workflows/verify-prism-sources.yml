# Runtime verification; private synthetic delivery requires explicit opt-in inputs.
name: Verify h-ua runtime and private acceptance

on:
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: Private acceptance mode (send requires recipient consent)
        type: choice
        options: [none, preflight, send-one-private-test]
        default: none
      recipient_digest:
        description: SHA256 of the approved private Telegram chat ID (never the raw ID)
        type: string
        default: ''
      test_id:
        description: Stable test ID; an attempted send cannot be rerun
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: verify-hua-sources
  cancel-in-progress: false

jobs:
  cursors:
    name: Inspect four Prism source cursors
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment:
      name: edge-prod-2
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Query only source cursor metadata
        shell: bash
        run: bash scripts/check-prism-source-cursors.sh

      - name: Private acceptance (explicit opt-in)
        if: inputs.acceptance_mode != 'none'
        shell: bash
        env:
          E2E_MODE: ${{ inputs.acceptance_mode }}
          E2E_TARGET_DIGEST: ${{ inputs.recipient_digest }}
          E2E_TEST_ID: ${{ inputs.test_id }}
        run: bash scripts/run-prism-private-e2e.sh
